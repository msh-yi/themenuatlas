# Two builds of the static site in site/:
# - synthetic: from the invented fixture, uploaded as a workflow artifact (safe to share).
# - real: after each successful check run, on each push to main that touches the site, or by hand:
#   exported from Postgres, also stored in the bucket under site/, and deployed to GitHub Pages
#   (Marcus, 2026-10-16; see docs/PLAN.md, "Website"). Restaurants in data/seed/optouts.csv are left out.
name: site

on:
  push:
    branches: [main]
    paths: [site/**, src/menudb/site.py, src/menudb/analysis.py, tests/fixtures/synthetic_menus.json, .github/workflows/site.yml]
  workflow_run:
    workflows: [check]
    types: [completed]
  workflow_dispatch:
    inputs:
      source:
        description: synthetic (artifact) or db (bucket and GitHub Pages)
        type: choice
        options: [synthetic, db]
        default: synthetic

permissions:
  contents: read

# One Pages deploy at a time; a newer run waits rather than cancelling one mid-deploy.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  synthetic:
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.source == 'synthetic')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen --no-dev
      - run: uv run menudb export-site --source synthetic --out site/data --menus
      - run: node --check site/app.js
      - uses: actions/upload-artifact@v4
        with:
          name: site-synthetic
          path: site/
          retention-days: 14

  real:
    if: (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success') || github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.source == 'db')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_ENDPOINT_URL_S3: ${{ secrets.AWS_ENDPOINT_URL_S3 }}
      AWS_REGION: ${{ secrets.AWS_REGION }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen --no-dev
      # Counts only in the log, never names or menus.
      - run: uv run menudb export-site --source db --out site/data --to-bucket --menus
      - run: node --check site/app.js
      # The page, its scripts and data; not the README.
      - run: |
          mkdir -p "$RUNNER_TEMP/public"
          cp -r site/index.html site/app.js site/style.css site/world.js site/robots.txt site/data "$RUNNER_TEMP/public/"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/public

  deploy:
    needs: real
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
