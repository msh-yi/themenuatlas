# Scheduled menu check, then the extraction handoff through the bucket (see docs/PLAN.md).
# Logs are public: menudb prints IDs, hashes and statuses only.
name: check

on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:
    inputs:
      limit:
        description: max sources to check (blank = all due)
        required: false

concurrency:
  group: check
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      # Migrations use the direct URL; menudb falls back to DATABASE_URL when it is unset.
      DATABASE_URL_UNPOOLED: ${{ secrets.DATABASE_URL_UNPOOLED }}
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_ENDPOINT_URL_S3: ${{ secrets.AWS_ENDPOINT_URL_S3 }}
      AWS_REGION: ${{ secrets.AWS_REGION }}
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6

      - run: uv sync --frozen --no-dev

      - name: Playwright version
        id: pw
        run: echo "version=$(uv run python -c 'import importlib.metadata as m; print(m.version("playwright"))')" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}

      - run: uv run playwright install --with-deps chromium

      # Applies new migrations from main before anything touches the tables.
      - run: uv run alembic upgrade head

      # Upserts the full list (restaurants only) and the curated list with recipes, so
      # recipe edits on main take effect on the next run and bucket-only extractions
      # from recheck.yml have a restaurant to import into.
      - run: uv run menudb seed

      - name: menudb check
        env:
          LIMIT: ${{ inputs.limit }}
        run: uv run menudb check ${LIMIT:+--limit "$LIMIT"}

      # Applies ingredient review decisions a session left in review/decisions/,
      # before import so new extractions use the corrected aliases.
      - run: uv run menudb review apply --from-bucket

      # Loads extractions that sessions wrote to extracted/ in the bucket. Runs after
      # check, so documents queued before their menu row existed can now be matched.
      - run: uv run menudb import --from-bucket

      # Queues menus that still need extraction in pending/ for the next session.
      - run: uv run menudb pending --to-bucket

      # Extracts the newly queued menus with the rule-based lexicon (no LLM), then
      # imports them, so new menus reach Postgres in the same run. Scans with no
      # text layer stay in pending/ for a session.
      - run: uv run menudb extract-auto
      - run: uv run menudb import --from-bucket

      # Refreshes review/queue.json for the next review in a session.
      - run: uv run menudb review export --to-bucket

      # Row counts (no menu text) in the run's summary page.
      - run: uv run menudb stats
