# Scheduled menu check. Logs are public: menudb prints IDs, hashes and statuses only.
name: check

on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:
    inputs:
      limit:
        description: max sources to check (blank = all due)
        required: false

concurrency:
  group: check
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_ENDPOINT_URL_S3: ${{ secrets.AWS_ENDPOINT_URL_S3 }}
      AWS_REGION: ${{ secrets.AWS_REGION }}
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6

      - run: uv sync --frozen --no-dev

      - name: Playwright version
        id: pw
        run: echo "version=$(uv run python -c 'import importlib.metadata as m; print(m.version("playwright"))')" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}

      - run: uv run playwright install --with-deps chromium

      # Upserts restaurants and recipes, so recipe edits on main take effect on the next run.
      - run: uv run menudb seed

      - name: menudb check
        env:
          LIMIT: ${{ inputs.limit }}
        run: uv run menudb check ${LIMIT:+--limit "$LIMIT"}
