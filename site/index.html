  <!-- The Michelin star, drawn as a stroke: top and bottom petals, plus the side petals that branch off them. -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <symbol id="mstar" viewBox="0 0 960 1048">
      <g fill="none" stroke="currentColor" stroke-width="64">
        <g id="mstar-half">
          <path d="M407 397C360 300 332 240 333 185C334 120 390 88 480 88C570 88 626 120 627 185C628 240 600 300 553 397"/>
          <path d="M333 212C260 170 150 175 90 250C30 320 30 400 90 450C150 500 250 515 335 525"/>
          <path d="M627 212C700 170 810 175 870 250C930 320 930 400 870 450C810 500 710 515 625 525"/>
        </g>
        <use href="#mstar-half" transform="matrix(1 0 0 -1 0 1048)"/>
      </g>
    </symbol>
  </svg>
  <header class="top">
    <a class="brand" href="#/">The Menu Atlas</a>
    <nav aria-label="Sections">
      <a href="#/ingredients" data-nav="ingredients">Ingredients</a>
      <a href="#/restaurants" data-nav="restaurants">Restaurants</a>
      <a href="#/pairings" data-nav="pairings">Pairings</a>
      <a href="#/coverage" data-nav="coverage">Map</a>
      <a href="#/about" data-nav="about">About</a>
    </nav>
  </header>
  <div id="banner" class="banner" hidden></div>
  <main id="app" tabindex="-1"><p class="muted">Loading…</p></main>
  <footer class="foot">
    <span id="stamp"></span>
    <span>Derived data only. Each restaurant links to its own site.</span>
  </footer>
  <div id="tip" class="tip" role="tooltip" hidden></div>
  <script src="world.js"></script>
  <script src="app.js"></script>
</body>
</html>
